apiVersion: v1
kind: Secret
metadata:
  name: clawmanager-northbound-secrets
  namespace: clawmanager-system
type: Opaque
stringData:
  db-user: REPLACE_WITH_RESTRICTED_DATABASE_USER
  db-password: REPLACE_WITH_RESTRICTED_DATABASE_PASSWORD
  jwt-secret: REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES
  refresh-token-pepper: REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES
  internal-jwt-secret: REPLACE_WITH_A_DIFFERENT_32_BYTE_SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: clawmanager-iei-sso
  namespace: clawmanager-system
type: Opaque
stringData:
  # Use the 16-byte system key agreed with the unified platform.
  aes-key: REPLACE_WITH_EXACTLY_16_BYTES
  # This identifier is not confidential, but it must exactly match the platform.
  aes-iv: CLAWMANAGETOKENS
  session-secret: REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES
