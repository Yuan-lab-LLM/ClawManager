apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawmanager-northbound-gateway
  namespace: clawmanager-system
  labels:
    app: clawmanager-northbound-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clawmanager-northbound-gateway
  template:
    metadata:
      labels:
        app: clawmanager-northbound-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/yuan-lab-llm/clawmanager:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/clawreef-northbound-gateway"]
          ports:
            - name: northbound
              containerPort: 9443
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: SERVER_MODE
              value: release
            - name: CLAWMANAGER_NORTHBOUND_ENABLED
              value: "true"
            - name: NORTHBOUND_GATEWAY_ADDRESS
              value: ":9443"
            - name: NORTHBOUND_CORE_BASE_URL
              value: https://clawmanager-northbound-core.clawmanager-system.svc.cluster.local:9002
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: clawmanager
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: clawmanager-northbound-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clawmanager-northbound-secrets
                  key: db-password
            - name: NORTHBOUND_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clawmanager-northbound-secrets
                  key: jwt-secret
            - name: NORTHBOUND_REFRESH_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: clawmanager-northbound-secrets
                  key: refresh-token-pepper
            - name: NORTHBOUND_INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clawmanager-northbound-secrets
                  key: internal-jwt-secret
            - name: NORTHBOUND_JWE_KEY_ID
              value: nb-login-v1
            - name: NORTHBOUND_GATEWAY_TLS_CERT_FILE
              value: /etc/clawmanager/northbound/server/tls.crt
            - name: NORTHBOUND_GATEWAY_TLS_KEY_FILE
              value: /etc/clawmanager/northbound/server/tls.key
            - name: NORTHBOUND_GATEWAY_CLIENT_CERT_FILE
              value: /etc/clawmanager/northbound/core-client/tls.crt
            - name: NORTHBOUND_GATEWAY_CLIENT_KEY_FILE
              value: /etc/clawmanager/northbound/core-client/tls.key
            - name: NORTHBOUND_CORE_CA_FILE
              value: /etc/clawmanager/northbound/core-ca/ca.crt
            - name: NORTHBOUND_JWE_PRIVATE_KEY_FILE
              value: /etc/clawmanager/northbound/jwe/private.pem
          volumeMounts:
            - { name: gateway-server-tls, mountPath: /etc/clawmanager/northbound/server, readOnly: true }
            - { name: gateway-core-client-tls, mountPath: /etc/clawmanager/northbound/core-client, readOnly: true }
            - { name: core-ca, mountPath: /etc/clawmanager/northbound/core-ca, readOnly: true }
            - { name: jwe-key, mountPath: /etc/clawmanager/northbound/jwe, readOnly: true }
          readinessProbe:
            tcpSocket: { port: northbound }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: northbound }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: gateway-server-tls
          secret: { secretName: clawmanager-northbound-gateway-tls }
        - name: gateway-core-client-tls
          secret: { secretName: clawmanager-northbound-gateway-client-tls }
        - name: core-ca
          secret: { secretName: clawmanager-northbound-core-ca }
        - name: jwe-key
          secret: { secretName: clawmanager-northbound-jwe }
---
apiVersion: v1
kind: Service
metadata:
  name: clawmanager-northbound-gateway
  namespace: clawmanager-system
spec:
  type: NodePort
  selector:
    app: clawmanager-northbound-gateway
  ports:
    - name: https
      port: 443
      targetPort: northbound
      nodePort: 38443
---
apiVersion: v1
kind: Service
metadata:
  name: clawmanager-northbound-core
  namespace: clawmanager-system
spec:
  type: ClusterIP
  selector:
    app: clawmanager-app
  ports:
    - name: mtls
      port: 9002
      targetPort: 9002
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: northbound-gateway-boundaries
  namespace: clawmanager-system
spec:
  podSelector:
    matchLabels:
      app: clawmanager-northbound-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 9443 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app: clawmanager-app }
      ports:
        - { protocol: TCP, port: 9002 }
    - to:
        - podSelector:
            matchLabels: { app: mysql }
      ports:
        - { protocol: TCP, port: 3306 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: northbound-core-ingress
  namespace: clawmanager-system
spec:
  podSelector:
    matchLabels:
      app: clawmanager-app
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8443 }
        - { protocol: TCP, port: 9001 }
    - from:
        - podSelector:
            matchLabels: { app: clawmanager-northbound-gateway }
      ports:
        - { protocol: TCP, port: 9002 }
