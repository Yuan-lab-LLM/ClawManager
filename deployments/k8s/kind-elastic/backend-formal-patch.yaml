# Kubernetes >=1.34 with PodLevelResources. Eight slots plus coordinator.
# Requests reserve scheduling capacity; inspect MemoryQoS before claiming protection.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawmanager-app
  namespace: clawmanager-system
spec:
  template:
    spec:
      containers:
        - name: clawmanager-app
          env:
            - {name: RUNTIME_CONTAINER_SLOTS, value: "8"}
            - {name: RUNTIME_MAX_GATEWAYS_PER_POD, value: "8"}
            - {name: RUNTIME_GATEWAY_START_IN_FLIGHT_LIMIT, value: "8"}
            - {name: RUNTIME_POD_CPU_REQUEST, value: "4"}
            - {name: RUNTIME_POD_CPU_LIMIT, value: "4"}
            - {name: RUNTIME_POD_MEMORY_REQUEST, value: "16Gi"}
            - {name: RUNTIME_POD_MEMORY_LIMIT, value: "16Gi"}
            - {name: RUNTIME_SLOT_CPU_REQUEST, value: "100m"}
            - {name: RUNTIME_SLOT_CPU_LIMIT, value: "1"}
            - {name: RUNTIME_SLOT_MEMORY_REQUEST, value: "1Gi"}
            - {name: RUNTIME_SLOT_MEMORY_LIMIT, value: "4Gi"}
            - {name: RUNTIME_POD_USER_NAMESPACES, value: "true"}
