# MySQL full-backup identity and daily full backup.
# Prerequisite: add mysql-backup-password to the existing
# clawmanager-secrets Secret before applying this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-production-backup-scripts
  namespace: clawmanager-system
data:
  bootstrap-users.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    until MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql \
      --host=mysql --user=root --ssl-mode=REQUIRED \
      --batch --skip-column-names --execute='SELECT 1' >/dev/null 2>&1; do
      sleep 5
    done

    backup_password_b64="$(printf '%s' "${MYSQL_BACKUP_PASSWORD}" | base64 | tr -d '\r\n')"

    MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql \
      --host=mysql --user=root --ssl-mode=REQUIRED <<SQL
    SET @backup_password = FROM_BASE64('${backup_password_b64}');
    SET @create_backup = CONCAT(
      "CREATE USER IF NOT EXISTS 'clawmanager_backup'@'%' IDENTIFIED BY ",
      QUOTE(@backup_password), " REQUIRE SSL"
    );
    PREPARE statement FROM @create_backup;
    EXECUTE statement;
    DEALLOCATE PREPARE statement;
    SET @alter_backup = CONCAT(
      "ALTER USER 'clawmanager_backup'@'%' IDENTIFIED BY ",
      QUOTE(@backup_password), " REQUIRE SSL"
    );
    PREPARE statement FROM @alter_backup;
    EXECUTE statement;
    DEALLOCATE PREPARE statement;
    GRANT SELECT, SHOW VIEW, TRIGGER, EVENT, RELOAD, PROCESS, REPLICATION CLIENT
      ON *.* TO 'clawmanager_backup'@'%';

    FLUSH PRIVILEGES;
    SQL

  attempt-ownership.sh: |
    #!/usr/bin/env bash
    # All cooperative writers hold the stable root lock; attempt locks survive
    # pod exits without relying on PIDs or heartbeat clocks for liveness.
    acquire_backup_lock() {
      command -v flock >/dev/null || { echo "ERROR: flock is required" >&2; return 1; }
      [ -d "${FULL_ROOT}" ] && [ ! -L "${FULL_ROOT}" ] || return 1
      [ "$(realpath -e "${FULL_ROOT}")" = "${FULL_ROOT}" ] || return 1
      [ ! -L "${FULL_ROOT}/cleanup.log" ] || return 1
      [ ! -L "${FULL_ROOT}/.maintenance.lock" ] || return 1
      if [ "${_backup_lock_held:-0}" != 1 ]; then
        exec 9>"${FULL_ROOT}/.maintenance.lock"
        flock -n -x 9 || { echo "ERROR: another backup or cleanup holds the root lock" >&2; return 1; }
        _backup_lock_held=1
      fi
    }
    reclaim_partial_attempts() {
      acquire_backup_lock || return 1
      local candidate token marker stamp now lock reclaimed=0
      now="$(date -u +%s)"
      while IFS= read -r -d '' candidate; do
        [ "${reclaimed}" -lt 32 ] || break
        [ ! -L "${candidate}" ] && [ -d "${candidate}" ] || continue
        token="${candidate##*/}"; token="${token%.partial}"
        [[ "${token}" =~ ^[A-Za-z0-9_-]{1,100}$ ]] || continue
        [ -f "${candidate}/owner" ] && [ ! -L "${candidate}/owner" ] || continue
        [ -f "${candidate}/heartbeat" ] && [ ! -L "${candidate}/heartbeat" ] || continue
        marker="$(cat "${candidate}/owner")"
        [ "${marker}" = "$(printf 'cm-mysql-full-v1\n%s' "${token}")" ] || continue
        stamp="$(stat -c %Y "${candidate}/heartbeat")"
        [ "$((now - stamp))" -ge 86400 ] || continue
        lock="${FULL_ROOT}/.attempt-${token}.lock"
        [ ! -L "${lock}" ] || continue
        (
          exec 8>"${lock}"
          flock -n -x 8 || exit 0
          # Recheck control files after owning both locks. Never follow links.
          [ -d "${candidate}" ] && [ ! -L "${candidate}" ] || exit 0
          [ ! -L "${candidate}/owner" ] && [ ! -L "${candidate}/heartbeat" ] || exit 0
          [ "$(cat "${candidate}/owner")" = "${marker}" ] || exit 0
          [ "$(( $(date -u +%s) - $(stat -c %Y "${candidate}/heartbeat") ))" -ge 86400 ] || exit 0
          find -P "${candidate}" -xdev -depth -delete
          printf '%s reclaimed %s\n' "$(date -u +%FT%TZ)" "${token}" >>"${FULL_ROOT}/cleanup.log"
        )
        reclaimed="$((reclaimed + 1))"
      done < <(find -P "${FULL_ROOT}" -mindepth 1 -maxdepth 1 -type d -name '*.partial' -print0)
    }

  full-backup.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    readonly BACKUP_ROOT=/backup
    readonly FULL_ROOT="${BACKUP_ROOT}/full"
    readonly RETAIN_SUCCESSFUL=7
    readonly SOFT_BUDGET_KIB=1073741824

    umask 077
    mkdir -p "${FULL_ROOT}"
    source /scripts/attempt-ownership.sh
    acquire_backup_lock
    reclaim_partial_attempts

    used_kib="$(du -sk "${BACKUP_ROOT}" | awk '{print $1}')"
    used_percent="$((used_kib * 100 / SOFT_BUDGET_KIB))"
    if [ "${used_percent}" -ge 85 ]; then
      echo "ERROR: MySQL backup directory has reached ${used_percent}% of its 1 TiB soft budget; refusing to start another full backup." >&2
      exit 1
    fi
    if [ "${used_percent}" -ge 70 ]; then
      echo "WARNING: MySQL backup directory has reached ${used_percent}% of its 1 TiB soft budget; capacity expansion is required." >&2
    fi

    latest_dump="$(find "${FULL_ROOT}" -mindepth 2 -maxdepth 2 -type f -name dump.sql.gz -printf '%T@ %p\n' \
      | sort -nr | awk 'NR==1 {sub(/^[^ ]+ /, ""); print}')"
    if [ -n "${latest_dump}" ]; then
      previous_bytes="$(wc -c <"${latest_dump}" | tr -d ' ')"
      available_bytes="$(( $(df -Pk "${BACKUP_ROOT}" | awk 'NR==2 {print $4}') * 1024 ))"
      if [ "${available_bytes}" -lt "$((previous_bytes * 2))" ]; then
        echo "ERROR: NFS free space is less than twice the previous full-backup size." >&2
        exit 1
      fi
    fi

    timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
    attempt="${timestamp}-$(cat /proc/sys/kernel/random/uuid)"
    run_dir="${FULL_ROOT}/${attempt}.partial"
    final_dir="${FULL_ROOT}/${timestamp}"
    exec 8>"${FULL_ROOT}/.attempt-${attempt}.lock"
    flock -n -x 8
    mkdir "${run_dir}"
    printf 'cm-mysql-full-v1\n%s\n' "${attempt}" >"${run_dir}/owner"
    touch "${run_dir}/heartbeat"
    heartbeat_loop() {
      local sleeper=''
      trap '[ -z "${sleeper}" ] || { kill "${sleeper}" 2>/dev/null || true; wait "${sleeper}" 2>/dev/null || true; }; exit 0' TERM INT
      while :; do
        touch "${run_dir}/heartbeat" || return
        sleep 30 & sleeper=$!
        wait "${sleeper}" || return
      done
    }
    heartbeat_loop &
    heartbeat_pid=$!
    trap 'kill "${heartbeat_pid}" 2>/dev/null || true; wait "${heartbeat_pid}" 2>/dev/null || true' EXIT


    export MYSQL_PWD="${MYSQL_BACKUP_PASSWORD}"
    gtid_executed="$(mysql --host=mysql --user=clawmanager_backup --ssl-mode=REQUIRED \
      --batch --skip-column-names --execute='SELECT @@GLOBAL.gtid_executed')"

    mysqldump --host=mysql --user=clawmanager_backup --ssl-mode=REQUIRED \
      --all-databases --single-transaction --quick --routines --events \
      --triggers --hex-blob --source-data=2 --set-gtid-purged=AUTO \
      | gzip -1 >"${run_dir}/dump.sql.gz"

    source_line="$(gzip -cd "${run_dir}/dump.sql.gz" \
      | awk '/^-- CHANGE REPLICATION SOURCE TO / && !found {print; found=1}')"
    binlog_file="$(printf '%s\n' "${source_line}" \
      | sed -n "s/.*SOURCE_LOG_FILE='\([^']*\)'.*/\1/p")"
    binlog_position="$(printf '%s\n' "${source_line}" \
      | sed -n 's/.*SOURCE_LOG_POS=\([0-9][0-9]*\).*/\1/p')"
    if [ -z "${binlog_file}" ] || [ -z "${binlog_position}" ]; then
      echo "ERROR: mysqldump did not contain an exact binary-log coordinate." >&2
      exit 1
    fi

    (
      cd "${run_dir}"
      sha256sum dump.sql.gz >SHA256SUMS
    )
    dump_bytes="$(wc -c <"${run_dir}/dump.sql.gz" | tr -d ' ')"
    cat >"${run_dir}/manifest.env" <<EOF
    BACKUP_FORMAT_VERSION=1
    COMPLETED_AT_UTC=${timestamp}
    BINLOG_FILE=${binlog_file}
    BINLOG_POSITION=${binlog_position}
    GTID_EXECUTED_B64=$(printf '%s' "${gtid_executed}" | base64 | tr -d '\r\n')
    DUMP_BYTES=${dump_bytes}
    MYSQL_CLIENT_VERSION=$(mysql --version | tr ' ' '_')
    MYSQLDUMP_VERSION=$(mysqldump --version | tr ' ' '_')
    EOF
    touch "${run_dir}/complete"
    kill "${heartbeat_pid}" 2>/dev/null || true
    wait "${heartbeat_pid}" 2>/dev/null || true
    mv -T "${run_dir}" "${final_dir}"

    mapfile -t successful_backups < <(
      while IFS= read -r old_name; do
        [[ "${old_name}" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || continue
        old_path="${FULL_ROOT}/${old_name}"
        [ ! -L "${old_path}" ] && [ -f "${old_path}/complete" ] && [ ! -L "${old_path}/complete" ] && [ -f "${old_path}/manifest.env" ] && [ ! -L "${old_path}/manifest.env" ] || continue
        printf '%s\n' "${old_name}"
      done < <(find -P "${FULL_ROOT}" -mindepth 1 -maxdepth 1 -type d ! -name '*.partial' -printf '%f\n' | sort -r)
    )
    if [ "${#successful_backups[@]}" -gt "${RETAIN_SUCCESSFUL}" ]; then
      for old_name in "${successful_backups[@]:${RETAIN_SUCCESSFUL}}"; do
        old_path="${FULL_ROOT}/${old_name}"
        [[ "${old_name}" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || continue
        [ ! -L "${old_path}" ] && [ -f "${old_path}/complete" ] && [ -f "${old_path}/manifest.env" ] || continue
        case "${old_path}" in
          "${FULL_ROOT}"/*) find "${old_path}" -depth -delete ;;
          *) echo "ERROR: refusing unsafe backup cleanup target ${old_path}" >&2; exit 1 ;;
        esac
      done
    fi

    echo "MySQL full backup completed: ${final_dir}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-production-backup-users
  namespace: clawmanager-system
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: mysql-production-backup-users
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: 10.130.15.40:5000/mysql:8.4.8
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/bootstrap-users.sh"]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: mysql-root-password
            - name: MYSQL_BACKUP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clawmanager-secrets
                  key: mysql-backup-password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: mysql-production-backup-scripts
            defaultMode: 0550
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-production-full-backup
  namespace: clawmanager-system
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: mysql-production-full-backup
        spec:
          restartPolicy: Never
          initContainers:
            - name: backup-lock-helper
              image: 10.130.15.40:5000/mysql:8.4.8
              imagePullPolicy: IfNotPresent
              command:
                - bash
                - -euc
                - |
                  gzip -dc /lock-helper/flock.gz > /opt/cm-backup-tools/flock
                  sha256sum -c /lock-helper/SHA256SUMS
                  chmod 0555 /opt/cm-backup-tools/flock
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
              volumeMounts:
                - name: backup-lock-helper
                  mountPath: /lock-helper
                  readOnly: true
                - name: backup-tools
                  mountPath: /opt/cm-backup-tools
          containers:
            - name: backup
              image: 10.130.15.40:5000/mysql:8.4.8
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/full-backup.sh"]
              env:
                - name: PATH
                  value: /opt/cm-backup-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                - name: MYSQL_BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clawmanager-secrets
                      key: mysql-backup-password
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              volumeMounts:
                - name: backup-tools
                  mountPath: /opt/cm-backup-tools
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup-lock-helper
              configMap:
                name: mysql-backup-lock-helper-v1
                defaultMode: 0440
            - name: backup-tools
              emptyDir:
                sizeLimit: 8Mi
            - name: scripts
              configMap:
                name: mysql-production-backup-scripts
                defaultMode: 0550
            - name: backup
              persistentVolumeClaim:
                claimName: clawmanager-mysql-backups
