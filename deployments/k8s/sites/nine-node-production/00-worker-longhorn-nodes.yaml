# Apply this file before 10-clawmanager-production.yaml.
# 900 GiB is reserved on each approximately 3.5 TiB root filesystem for the
# operating system, containerd, and Kubernetes. The Longhorn data directory is
# an ordinary directory on the root LVM, not a separate mount.
apiVersion: v1
kind: Node
metadata:
  name: k8s-worker1
  labels:
    node.longhorn.io/create-default-disk: "config"
  annotations:
    node.longhorn.io/default-disks-config: >-
      [{"path":"/var/lib/longhorn","allowScheduling":true,"storageReserved":966367641600,"tags":["worker-local"]}]
---
