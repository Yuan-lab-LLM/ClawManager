# Strategic merge patch. Choose a preview domain separate from the login site.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawmanager-app
  namespace: clawmanager-system
spec:
  template:
    spec:
      containers:
        - name: clawmanager-app
          env:
            - name: CLAWMANAGER_WORKBENCH_PREVIEW_ORIGIN
              value: "https://p-{token}.preview.example.net"
