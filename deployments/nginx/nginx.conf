load_module modules/ngx_http_js_module.so;

# The control-plane container can see every host CPU. On large Kubernetes
# nodes, "auto" creates hundreds of workers and exhausts the host-wide Linux
# AIO pool before Nginx begins serving traffic. Eight workers still provide up
# to 65,536 frontend connections with the worker_connections limit below.
worker_processes 8;

# Expose the instance-access JWT secret to njs (process.env) so the edge
# gateway can verify desktop access tokens locally. Values come from the
# container environment; they are not logged.
env INSTANCE_ACCESS_TOKEN_SECRET;
env JWT_SECRET;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    js_import desktop from /etc/nginx/njs/desktop_auth.js;

    # Cluster DNS resolver, templated by start.sh from /etc/resolv.conf so the
    # desktop location can resolve per-instance Service FQDNs at request time.
    resolver __DNS_RESOLVER__ valid=10s ipv6=off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;
    keepalive_timeout 75;
    keepalive_requests 10000;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $desktop_target $desktop_proxy_mode {
        "deny" "deny";
        "http://127.0.0.1:9001" "fallback";
        default "direct";
    }

    # Even a cleaned proxy URI may carry a short-lived CM WebSocket ticket.
    # Log only the path; keep the full cleaned URI exclusively for forwarding.
    log_format desktop_proxy '$remote_addr - $status "$request_method $uri $server_protocol" '
                             'mode=$desktop_proxy_mode upstream="$upstream_addr" '
                             'rt=$request_time urt=$upstream_response_time bytes=$body_bytes_sent';

    # WebSocket requests may carry a one-use BFF ticket: never log queries.
    log_format hermes_desktop '$remote_addr - $status "$request_method $uri $server_protocol" '
                              'rt=$request_time bytes=$body_bytes_sent';

    upstream clawreef_backend {
        server 127.0.0.1:9001;
        keepalive 128;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        # Also cover rejected/malformed paths, internal error redirects and
        # missing renderer assets before they can inherit a raw combined log.
        # nginx request error messages cannot be redacted; safe access logs
        # retain failure statuses/timing, while startup diagnostics stay global.
        access_log /var/log/nginx/access.log hermes_desktop;
        error_log /dev/null;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        root /usr/share/nginx/html;
        index index.html;

        # Allow runtime workspace archives through the API.
        # Default nginx client_max_body_size (1 MiB) would reject normal
        # workspace uploads at the edge with 413 Content Too Large before
        # the request reaches the backend. start.sh rewrites this value from
        # CLAWMANAGER_WORKSPACE_ARCHIVE_MAX_MIB when set.
        client_max_body_size 500m;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location ^~ /assets/ {
            try_files $uri =404;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* ^/(?:lobster_logo|lobster_transparent|openclaw|hermes)\.png$ {
            try_files $uri =404;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        location ~* ^/vendor-icons/.+\.(?:png|jpg|jpeg|gif|webp|ico|svg)$ {
            try_files $uri =404;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # The unified platform delivers a one-time AES token in this initial
        # URL. Never persist the query string in the nginx access log; the SPA
        # exchanges it for an HttpOnly IEI session and removes it immediately.
        location = /ieisystem/list-instances {
            access_log off;
            add_header Cache-Control "no-store" always;
            add_header Pragma "no-cache" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files /index.html =404;
        }

        location ^~ /ieisystem/ {
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            try_files $uri $uri/ /index.html;
        }

        location ~ ^/s/ {
            proxy_pass http://clawreef_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 15s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location ~ ^/api/v1/instances/(?<inst_id>[0-9]+)/proxy(?<proxy_sub>/.*)?$ {
            # njs verifies the instance-access JWT locally and chooses the
            # proxy target: the instance Service (direct), the in-process
            # control-plane proxy (gray fallback), or "deny". A scoped Hermes
            # Dashboard cookie always selects the backend for full validation;
            # cookie presence alone never authorizes a direct runtime request.
            js_set $desktop_target desktop.resolveTarget;
            # Forward the original URI to the upstream but with the JWT "token"
            # query param stripped, so the access token never reaches webtop.
            js_set $desktop_clean_uri desktop.cleanUri;

            access_log /var/log/nginx/access.log desktop_proxy;
            # nginx error messages embed the original URI and cannot use a
            # redacting log_format. Keep status/timing in the safe access log.
            error_log /dev/null;
            add_header X-ClawManager-Desktop-Proxy $desktop_proxy_mode always;

            error_page 463 = @desktop_denied;
            if ($desktop_target = "deny") {
                return 463;
            }

            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /api/v1/instances/$inst_id/proxy;
            # Dedicated-origin trust is asserted only by the runtime virtual
            # hosts below, never by a client using the legacy public path.
            proxy_set_header X-ClawManager-Runtime-Origin "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Browsers may include the original iframe URL (with ?token=...)
            # as Referer on subresource requests. Do not forward it to webtop.
            proxy_set_header Referer "";

            proxy_ssl_verify off;
            proxy_ssl_server_name on;

            proxy_connect_timeout 15s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_pass $desktop_target$desktop_clean_uri;
        }

        # Always use the BFF, even when legacy desktop direct proxying is on.
        location ~ ^/api/v1/instances/[0-9]+/hermes-desktop(?:/|$) {
            access_log /var/log/nginx/access.log hermes_desktop;
            error_log /dev/null;
            # Keep independent of start.sh's workspace archive '*m' rewrite.
            client_max_body_size 1024k;
            proxy_pass http://clawreef_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Referer "";
            proxy_connect_timeout 15s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Missing renderer assets must not fall through to the main SPA.
        location = /hermes-desktop-web {
            return 308 /hermes-desktop-web/;
        }

        location ^~ /hermes-desktop-web/ {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; frame-src https://hermes-agent.nousresearch.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        }

        # The classic Hermes SSO bootstrap uses the ordinary instance access
        # endpoint. Preserve the external port for strict browser Origin checks.
        location ~ ^/api/v1/instances/[0-9]+/access$ {
            access_log /var/log/nginx/access.log hermes_desktop;
            error_log /dev/null;
            client_max_body_size 1024k;
            proxy_pass http://clawreef_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Referer "";
            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
        }

        # Browser Worker module scripts send an Origin header and its noVNC
        # transport upgrades to WebSocket. Preserve the public host including
        # its non-default port so the backend can enforce exact same-origin
        # access without weakening that check.
        location ~ ^/api/v1/instances/[0-9]+/browser-proxy(?:/|$) {
            proxy_pass http://clawreef_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-ClawManager-Runtime-Origin "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 15s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location /api/ {
            proxy_pass http://clawreef_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Only dedicated runtime virtual hosts may assert this internal
            # routing marker; discard any value supplied by public clients.
            proxy_set_header X-ClawManager-Runtime-Origin "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 15s;
            proxy_read_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location @desktop_denied {
            access_log /var/log/nginx/access.log desktop_proxy;
            error_log /dev/null;
            add_header Content-Type text/plain always;
            return 401 "Access token expired or invalid";
        }
    }

    # OpenCode's built-in web UI assumes it owns the root of its origin: its
    # static assets, API calls, websocket URLs, manifest, and service worker all
    # start at "/". Give each logical OpenCode instance a distinct virtual host
    # while retaining the shared runtime Pod/process pool. The public hostname
    # is generated by CLAWMANAGER_OPENCODE_PUBLIC_URL_TEMPLATE.
    server {
        listen 8443 ssl;
        http2 on;
        server_name ~^opencode-(?<runtime_inst_id>[0-9]+)\..+$;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 500m;

        # TLS verification happens before HTTP routing. These token-free
        # endpoints let ClawManager probe this dedicated origin and, when the
        # browser requires confirmation, return to the previous detail page
        # without exposing the instance access token in history or logs.
        location = /__clawmanager_cert_check {
            access_log off;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            return 204;
        }

        location = /__clawmanager_cert_trust {
            access_log off;
            default_type text/html;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
            return 200 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正在返回 ClawManager</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:system-ui,sans-serif}main{text-align:center;padding:24px}button{margin-top:16px;padding:9px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}</style></head><body><main><h1>证书确认完成</h1><p>正在返回 ClawManager...</p><button type="button" onclick="window.history.back()">返回 ClawManager</button></main><script>window.setTimeout(function(){window.history.back();},150);</script></body></html>';
        }

        # Refresh the origin-scoped access cookie without reloading the active
        # OpenCode UI. The query capability is validated by njs and never sent
        # to the runtime application or written to the access log.
        location = /__clawmanager_access_refresh {
            access_log off;
            js_set $desktop_target desktop.resolveTarget;
            error_page 463 = @opencode_origin_denied;
            if ($desktop_target = "deny") {
                return 463;
            }
            set $dedicated_refresh_token $arg_token;
            rewrite ^ /api/v1/instances/$runtime_inst_id/proxy/__clawmanager_access_refresh? break;
            proxy_pass http://clawreef_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-ClawManager-Runtime-Origin opencode;
            proxy_set_header X-ClawManager-Access-Refresh-Token $dedicated_refresh_token;
            proxy_set_header Referer "";
            proxy_connect_timeout 15s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location / {
            js_set $desktop_target desktop.resolveTarget;

            error_page 463 = @opencode_origin_denied;
            if ($desktop_target = "deny") {
                return 463;
            }

            rewrite ^(.*)$ /api/v1/instances/$runtime_inst_id/proxy$1 break;

            proxy_pass http://clawreef_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-ClawManager-Runtime-Origin opencode;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Referer "";
            proxy_connect_timeout 15s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location @opencode_origin_denied {
            add_header Content-Type text/plain always;
            return 401 "Access token expired or invalid";
        }
    }

    # DeepSeek Harness also owns the root of its browser origin. Lite
    # instances share one runtime Pod but receive isolated virtual hosts so
    # root-relative API and websocket routes remain compatible with dsh web.
    server {
        listen 8443 ssl;
        http2 on;
        server_name ~^deepseek-harness-(?<runtime_inst_id>[0-9]+)\..+$;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 500m;

        # Keep certificate confirmation outside the DSH proxy so the browser
        # can establish trust without an access token or a request to DSH.
        location = /__clawmanager_cert_check {
            access_log off;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            return 204;
        }

        location = /__clawmanager_cert_trust {
            access_log off;
            default_type text/html;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
            return 200 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正在返回 ClawManager</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:system-ui,sans-serif}main{text-align:center;padding:24px}button{margin-top:16px;padding:9px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}</style></head><body><main><h1>证书确认完成</h1><p>正在返回 ClawManager...</p><button type="button" onclick="window.history.back()">返回 ClawManager</button></main><script>window.setTimeout(function(){window.history.back();},150);</script></body></html>';
        }

        # Refresh the origin-scoped access cookie without reloading a running
        # DeepSeek Harness task. Keep the fresh capability out of logs and out
        # of the runtime application.
        location = /__clawmanager_access_refresh {
            access_log off;
            js_set $desktop_target desktop.resolveTarget;
            error_page 463 = @deepseek_harness_origin_denied;
            if ($desktop_target = "deny") {
                return 463;
            }
            set $dedicated_refresh_token $arg_token;
            rewrite ^ /api/v1/instances/$runtime_inst_id/proxy/__clawmanager_access_refresh? break;
            proxy_pass http://clawreef_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-ClawManager-Runtime-Origin deepseek-harness;
            proxy_set_header X-ClawManager-Access-Refresh-Token $dedicated_refresh_token;
            proxy_set_header Referer "";
            proxy_connect_timeout 15s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location / {
            js_set $desktop_target desktop.resolveTarget;

            error_page 463 = @deepseek_harness_origin_denied;
            if ($desktop_target = "deny") {
                return 463;
            }

            rewrite ^(.*)$ /api/v1/instances/$runtime_inst_id/proxy$1 break;

            proxy_pass http://clawreef_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-ClawManager-Runtime-Origin deepseek-harness;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Referer "";
            proxy_connect_timeout 15s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location @deepseek_harness_origin_denied {
            add_header Content-Type text/plain always;
            return 401 "Access token expired or invalid";
        }
    }
}
