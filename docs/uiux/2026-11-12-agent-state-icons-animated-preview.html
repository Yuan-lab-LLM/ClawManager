const states=[{id:'running',label:'运行中',detail:'原生 · 轻呼吸'},{id:'stopped',label:'已停止',detail:'熄灭 · 灰度定格'},{id:'error',label:'错误',detail:'感叹号缩放'},{id:'sleeping',label:'休眠',detail:'正在休息'}];
let selectedType='openclaw',selectedState='error';
function eyes(agent){if(agent.id!=='openclaw')return '';return `<svg class="sleep-eyes" viewBox="0 0 512 512" aria-hidden="true"><circle cx="192" cy="150" r="28" fill="#dc3639"/><circle cx="320" cy="150" r="28" fill="#d73538"/><path d="M176 148q16 15 32 0m96 0q16 15 32 0" fill="none" stroke="#25191a" stroke-width="9" stroke-linecap="round"/></svg>`;}
function icon(agent,state){const warning=state==='error'?'<svg class="warning" aria-hidden="true"><use href="#warning"/></svg>':'';const sleep=state==='sleeping'?'<svg class="sleep-sign" aria-hidden="true"><use href="#sleep"/></svg>':'';return `<span class="agent-icon ${state}" role="img" aria-label="${agent.name} · ${states.find(s=>s.id===state).label}"><span class="art"><img src="${agent.src}" alt="" draggable="false">${state==='sleeping'?eyes(agent):''}</span>${warning}${sleep}</span>`;}
const visibilityObserver='IntersectionObserver' in window?new IntersectionObserver(entries=>{for(const entry of entries)entry.target.classList.toggle('motion-paused',!entry.isIntersecting);}):null;
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('page-hidden',document.hidden));
const matrix=document.querySelector('#matrix');matrix.innerHTML=agents.map(a=>`<tr><th scope="row">${a.name}</th>${states.map(s=>`<td><button type="button" class="cell" data-type="${a.id}" data-state="${s.id}" aria-label="放大 ${a.name} ${s.label}" aria-pressed="false">${icon(a,s.id)}</button></td>`).join('')}</tr>`).join('');
const type=document.querySelector('#type');type.innerHTML=agents.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
function render(){const a=agents.find(a=>a.id===selectedType),s=states.find(s=>s.id===selectedState);type.value=selectedType;document.querySelectorAll('.cell').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.type===selectedType&&button.dataset.state===selectedState)));document.querySelector('#demo').innerHTML=states.map((s,i)=>`<div class="demo-row">${icon(a,s.id)}<div><div class="demo-name">${a.name}-0${i+1}</div><div class="demo-description">${s.detail}</div></div></div>`).join('');document.querySelector('#inspector').innerHTML=icon(a,s.id)+`<p>${a.name} · ${s.label}<br>放大查看</p>`;visibilityObserver?.disconnect();document.querySelectorAll('.agent-icon').forEach(icon=>visibilityObserver?.observe(icon));}
matrix.addEventListener('click',event=>{const button=event.target.closest('button[data-type]');if(!button)return;selectedType=button.dataset.type;selectedState=button.dataset.state;render();});
type.addEventListener('change',()=>{selectedType=type.value;render();});document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{document.documentElement.style.setProperty('--size',button.dataset.size+'px');document.querySelectorAll('[data-size]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));document.querySelector('#motion').addEventListener('change',event=>{document.body.classList.toggle('animate',event.target.checked);document.querySelector('#replay').disabled=!event.target.checked;});document.querySelector('#replay').addEventListener('click',()=>{document.body.classList.remove('animate');requestAnimationFrame(()=>requestAnimationFrame(()=>{if(document.querySelector('#motion').checked)document.body.classList.add('animate');}));});render();
</script></body></html>
