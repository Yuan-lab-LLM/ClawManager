<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">Auto 与 Hybrid 路由决策流程</title><desc id="desc">风险约束先行，Hybrid 明确规则直接给出档位，其他符合条件任务调用 Laya，失败回退本地规则，然后由 Gateway 筛选模型和选择部署。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<rect width="1200" height="1060" fill="#f8fafc"/>
<g font-family="Microsoft YaHei, Arial, sans-serif" fill="#17243b">
<text x="40" y="52" font-size="27" font-weight="700">Auto 决策：分类给建议，Gateway 决定调用</text>
<text x="40" y="86" font-size="17" fill="#526277">以下展开推荐的 Hybrid 模式；明确指定模型时不执行 Auto 难度分类。</text>
<g fill="#fff" stroke="#cad5e2"><rect x="370" y="115" width="460" height="65" rx="10"/><rect x="370" y="214" width="460" height="74" rx="10"/><rect x="35" y="214" width="250" height="74" rx="10"/><rect x="340" y="331" width="520" height="76" rx="10"/><rect x="45" y="453" width="470" height="76" rx="10"/><rect x="690" y="453" width="460" height="76" rx="10"/><rect x="690" y="570" width="460" height="76" rx="10"/><rect x="320" y="700" width="560" height="76" rx="10"/><rect x="320" y="818" width="560" height="76" rx="10"/><rect x="320" y="941" width="560" height="65" rx="10"/></g>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M600 180V204"/><path d="M370 251H295"/><path d="M600 288V321"/><path d="M340 369H280V443"/><path d="M860 369H920V443"/><path d="M920 529V560"/><path d="M280 529V738H310"/><path d="M920 646V738H890"/><path d="M600 776V808"/><path d="M600 894V931"/></g>
<g text-anchor="middle" font-size="21" font-weight="700"><text x="600" y="156">收到 model = auto 的请求</text><text x="600" y="245">执行风险策略</text><text x="160" y="245">阻断 / 要求审批</text><text x="600" y="362">Hybrid：是否明确命中本地规则？</text><text x="280" y="484">直接使用本地规则档位</text><text x="920" y="484">检查是否允许调用 Laya</text><text x="920" y="601">允许：Laya 分类</text><text x="600" y="731">权限 + 安全 + 工具 / 视觉 + 上下文</text><text x="600" y="849">满足档位后选主逻辑组，再排具体部署</text><text x="600" y="982">预算预占 / 部署准入 → 上游调用</text></g>
<g text-anchor="middle" font-size="17" fill="#526277"><text x="600" y="273">安全模型要求会约束后续候选，分类保持本地</text><text x="160" y="273">停止本次调用</text><text x="600" y="390">先判断覆盖范围，不以任意关键词命中作为确定性</text><text x="280" y="513">无需发送任务到 Laya</text><text x="920" y="513">模式、输入限制、外发条件、已保存连接</text><text x="920" y="630">不允许或失败：使用本地规则兜底</text><text x="600" y="760">档位只是建议，不能扩大权限；无候选则拒绝</text><text x="600" y="878">组间考虑成本，组内考虑 TTFT、速度、负载与健康</text><text x="302" y="433">是</text><text x="949" y="433">否 / 不确定</text></g>
<text x="40" y="1040" font-size="15" fill="#64748b">纯 rules 模式不调用 Laya；纯 laya 模式对符合条件的任务调用 Laya。流式回退仍受已输出内容限制。</text>
</g></svg>
