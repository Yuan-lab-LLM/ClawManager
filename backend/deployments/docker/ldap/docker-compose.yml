services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: clawmanager-openldap-test
    environment:
      LDAP_ORGANISATION: "Mock Company"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin123"
      LDAP_CONFIG_PASSWORD: "config123"
    ports:
      - "389:389"
    volumes:
      - ./mock-directory.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/bootstrap.ldif:ro
    command: --copy-service
