name: Build

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test Hermes iframe boundaries
        run: node --test src/lib/hermesDesktopFrame.test.mjs src/lib/browserWorkerAccess.test.mjs src/services/authService.test.mjs ../e2e/desktop-proxy-edge.test.mjs

  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClawManager/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ClawManager

      - name: Checkout native runtime contract
        uses: actions/checkout@v4
        with:
          repository: iamlovingit/AgentsRuntime
          ref: ${{ vars.AGENTS_RUNTIME_REF || 'container' }}
          token: ${{ secrets.AGENTS_RUNTIME_READ_TOKEN || github.token }}
          path: AgentsRuntime

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ClawManager/backend/go.mod
          cache-dependency-path: ClawManager/backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build backend
        run: go build -o bin/server ./cmd/server

      - name: Run backend tests
        run: go test ./...

  browser-worker:
    name: Browser Worker Build and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ClawManager
      - name: Checkout shared runtime broker
        uses: actions/checkout@v4
        with:
          repository: iamlovingit/AgentsRuntime
          ref: ${{ vars.AGENTS_RUNTIME_REF || 'container' }}
          token: ${{ secrets.AGENTS_RUNTIME_READ_TOKEN || github.token }}
          path: AgentsRuntime
      - uses: actions/setup-go@v5
        with:
          go-version-file: ClawManager/backend/go.mod
          cache: false
      - name: Test authenticated CDP and GUI relay
        working-directory: ClawManager/tools/images/browser-worker/cdp-proxy
        run: go test -race .
      - uses: docker/setup-buildx-action@v3
      - name: Build visible browser
        uses: docker/build-push-action@v6
        with:
          context: ClawManager/tools/images/browser-worker
          file: ClawManager/tools/images/browser-worker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: browser-worker:ci
      - name: Build relay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ClawManager/tools/images/browser-worker/Dockerfile.cdp-proxy
          platforms: linux/amd64
          push: false
          tags: browser-worker-relay:ci

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-platform application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          tags: clawmanager:ci

  k8s-smoke:
    name: Kubernetes Deploy Smoke Test
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local application image
        run: docker build --build-arg VERSION=ci-${GITHUB_SHA} --build-arg VCS_REF=${GITHUB_SHA} -t clawmanager:ci .

      - name: Install kind
        uses: helm/kind-action@v1.12.0
        with:
          install_only: true
          version: v0.31.0
          kubectl_version: v1.35.0

      - name: Setup browser tests
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chrome

      - name: Verify fresh single-node installation
        run: |
          python3 -B -m unittest discover -s tools/k8s -p test_install_fresh.py
          bash .github/scripts/run-k8s-smoke.sh clawmanager:ci
